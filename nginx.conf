server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # los jpg y png ya vienen comprimidos: gzip solo gastaria CPU sin ganar nada

  # NADA de HTML se cachea: ni la portada, ni el panel, ni la pagina de cada
  # iglesia. Asi un cambio se ve al recargar mientras se corrige con ellos
  # delante. Una regla sola y por extension, en vez de una por direccion: cada
  # iglesia nueva es una pagina nueva, y una lista de direcciones se queda
  # corta sin que nadie lo note.
  location ~* \.html$ { add_header Cache-Control "no-cache, must-revalidate"; }
  location = /        { add_header Cache-Control "no-cache, must-revalidate"; }
  # Las direcciones limpias —/parma, /parma/— sirven parma/index.html, y como
  # la direccion no acaba en .html la regla de arriba no las alcanza.
  #
  # Si la carpeta NO existe, se sirve _sede.html: la pagina comodin de las
  # iglesias creadas desde el panel, que todavia no tienen la suya generada.
  # Ella misma lee la ciudad de la direccion y, si no corresponde a ninguna
  # iglesia, dice "esta iglesia no esta" y ensena las que hay.
  #
  # Ojo: eso es un "soft 404" —una direccion inventada devuelve 200—. Hoy no
  # importa porque la web entera es noindex. El dia que se abra a Google, si
  # aparecen direcciones raras en Search Console, aqui es donde se mira.
  location ~ ^/[^./]+/?$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /_sede.html;
  }

  # Las fichas y el motor cambian cada vez que entra una iglesia nueva. Si se
  # cachearan, el encargado anadiria una sede y no la veria.
  location ~ ^/(sedi|fede|app|almacen|mapa|sede)\.js$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # El estilo, igual que el codigo: se comprueba cada vez (si no ha cambiado,
  # el servidor contesta "sigue igual" sin mandarlo otra vez). Con una hora de
  # cache, al publicar el rediseno en claro los moviles que ya habian entrado
  # veian la pagina nueva con el estilo viejo, en oscuro.
  location = /estilo.css { add_header Cache-Control "no-cache, must-revalidate"; }

  # Los mapas y el logo pesan y no cambian. Una semana, no un ano: los mapas
  # se regeneran cuando una iglesia se muda, y no llevan hash en el nombre.
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }

  # Lo que no existe tiene que decir que no existe. Devolver la portada con un
  # 200 ante cualquier direccion inventada es un "soft 404": Google lo detecta,
  # lo cuenta como pagina rota y llena el indice de copias de la home.
  location / { try_files $uri $uri/ =404; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
