server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # los jpg y png ya vienen comprimidos: gzip solo gastaria CPU sin ganar nada

  # El HTML no se cachea: asi un cambio se ve al instante mientras se corrige
  # con la iglesia delante.
  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
  location = /           { add_header Cache-Control "no-cache, must-revalidate"; }

  # El panel tampoco. Es lo que mas se va a tocar.
  location ~ ^/panel/?(index\.html)?$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Las fichas y el motor del panel cambian cada vez que entra una iglesia
  # nueva. Si se cachearan, el encargado anadiria una sede y no la veria.
  location ~ ^/(sedi|fede|app|almacen|mapa)\.js$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Los mapas y el logo pesan y no cambian. Una semana, no un ano: los mapas
  # se regeneran cuando una iglesia se muda, y no llevan hash en el nombre.
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }

  # Lo que no existe tiene que decir que no existe. Devolver la portada con un
  # 200 ante cualquier direccion inventada es un "soft 404": Google lo detecta,
  # lo cuenta como pagina rota y llena el indice de copias de la home.
  location / { try_files $uri $uri/ =404; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
