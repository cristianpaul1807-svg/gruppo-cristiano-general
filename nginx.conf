# --- su dominio o el provisional ------------------------------------------------
# En gruppocristiano.it la web se abre a Google. En cualquier otra direccion (la
# provisional de Easypanel) se le dice a Google que no la guarde: si no, saldria
# dos veces, y la de Easypanel podria ganar a la suya.
map $host $gc_robots {
  default                  "noindex, nofollow";
  www.gruppocristiano.it   "";
  gruppocristiano.it       "";
}
map $host $gc_robots_txt {
  default                  /robots-provisional.txt;
  www.gruppocristiano.it   /robots.txt;
  gruppocristiano.it       /robots.txt;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Una sola direccion para todo: sin www -> con www (es la que usan los datos
  # para Google y las vistas previas). Un 301, para que Google sume las dos.
  if ($host = gruppocristiano.it) { return 301 https://www.gruppocristiano.it$request_uri; }

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # los jpg y png ya vienen comprimidos: gzip solo gastaria CPU sin ganar nada

  # NADA de HTML se cachea: ni la portada, ni el panel, ni la pagina de cada
  # iglesia. Asi un cambio se ve al recargar mientras se corrige con ellos
  # delante. Una regla sola y por extension, en vez de una por direccion: cada
  # iglesia nueva es una pagina nueva, y una lista de direcciones se queda
  # corta sin que nadie lo note.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  # Las direcciones limpias —/parma, /parma/— sirven parma/index.html, y como
  # la direccion no acaba en .html la regla de arriba no las alcanza.
  #
  # Si la carpeta NO existe, se sirve _sede.html: la pagina comodin de las
  # iglesias creadas desde el panel, que todavia no tienen la suya generada.
  # Ella misma lee la ciudad de la direccion y, si no corresponde a ninguna
  # iglesia, dice "esta iglesia no esta" y ensena las que hay.
  #
  # Ojo: eso es un "soft 404" —una direccion inventada devuelve 200—, aunque la
  # pagina comodin dice "noindex" cuando la iglesia no existe. Si aparecen
  # direcciones raras en Search Console, aqui es donde se mira.
  location ~ ^/[^./]+/?$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /_sede.html;
  }

  # Las fichas y el motor cambian cada vez que entra una iglesia nueva. Si se
  # cachearan, el encargado anadiria una sede y no la veria.
  location ~ ^/(sedi|fede|app|almacen|mapa|sede|domande|contenuti)\.js$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # El estilo, igual que el codigo: se comprueba cada vez (si no ha cambiado,
  # el servidor contesta "sigue igual" sin mandarlo otra vez). Con una hora de
  # cache, al publicar el rediseno en claro los moviles que ya habian entrado
  # veian la pagina nueva con el estilo viejo, en oscuro.
  location = /estilo.css {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Los mapas y el logo pesan y no cambian. Una semana, no un ano: los mapas
  # se regeneran cuando una iglesia se muda, y no llevan hash en el nombre.
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # robots.txt segun el dominio: el de verdad en el suyo, "no entres" en el
  # provisional.
  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    rewrite ^ $gc_robots_txt break;
  }
  location = /robots-provisional.txt { internal; }

  # Lo que no existe tiene que decir que no existe. Devolver la portada con un
  # 200 ante cualquier direccion inventada es un "soft 404": Google lo detecta,
  # lo cuenta como pagina rota y llena el indice de copias de la home.
  location / {
    add_header X-Robots-Tag $gc_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
